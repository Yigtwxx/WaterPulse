name: waterpulse
description: WaterPulse hydration tracker app
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  dio: ^5.4.0
  window_manager: ^0.3.9
  shared_preferences: ^2.2.2
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  fl_chart: ^0.66.2
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.png"
  min_sdk_android: 21 # android min sdk min:16, default 21

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/
