name: waterpulse
description: WaterPulse hydration tracker app
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  window_size: ^0.1.0
  shared_preferences: ^2.2.2
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  fl_chart: ^0.66.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
